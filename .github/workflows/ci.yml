name: CI

on:
  push:
    branches: [main, 'feature/v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bee_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BEE_AGENT_STORAGE_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/bee_agent
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux sandbox provider
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu >= 23.10 restricts unprivileged user namespaces via
          # AppArmor, and the runner image does not load bubblewrap's
          # allowing profile after apt install — bwrap would fail with
          # "Creating new namespace failed" and the capability probe
          # (correctly) reports fail-closed. Lift the restriction so the
          # real filesystem-boundary contracts run; on images without the
          # sysctl key this is a no-op.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:boundaries
      - run: pnpm test
        env:
          BEE_REQUIRE_BWRAP: '1'
